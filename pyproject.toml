[project]
name = "mcp-foundry"
version = "0.1.0"
description = "Platform for scraping documentation, ingesting into Qdrant, and deploying MCP retrieval servers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LangMonk", email = "lang.monk93@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "asyncpg>=0.30",
  "crawl4ai>=0.4",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "qdrant-client>=1.13",
  "sentence-transformers>=3.0",
  "mcp>=1.4",
  "httpx>=0.28",
  "typer>=0.12",
]

[project.scripts]
mcp-foundry = "mcp_foundry.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "ty>=0.0.17",
  "httpx>=0.28.1",
  "autoflake>=2.3.3",
  "pytest-asyncio>=1.3.0",
]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.12" }

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["mcp_foundry"]
